<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-lg p-4" style="width: 100%; max-width: 400px; border-radius: 15px;">
        <div class="text-center mb-4">
            <i class="fas fa-microchip fa-3x text-primary mb-3"></i>
            <h2 class="fw-bold">LRP Giriş</h2>
            <p class="text-muted">Laboratuvar Yönetim Sistemi</p>
        </div>

        <div class="mb-3">
            <label class="form-label">Kullanıcı Adı</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-user"></i></span>
                <input type="text" id="username" class="form-control" placeholder="Kullanıcı adınızı girin">
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label">Şifre</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                <input type="password" id="password" class="form-control" placeholder="Şifrenizi girin">
            </div>
        </div>

        <button onclick="login()" class="btn btn-primary w-100 py-2 fw-bold" style="border-radius: 10px;">
            Giriş Yap <i class="fas fa-sign-in-alt ms-2"></i>
        </button>

        <div id="login-error" class="text-danger mt-3 text-center" style="display: none;">
            Hatalı kullanıcı adı veya şifre!
        </div>
    </div>
</div>
